<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fairways and Fastballs</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: rgb(243, 228, 209);
      padding: 40px 0;
    }

    img {
      max-width: 50%;
      display: block;
    }

    .cta-wrapper {
      margin-top: 36px;
    }

    .cta-button {
      display: inline-block;
      text-decoration: none;
      background-color: #c8471a;
      color: rgb(243, 228, 209);
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 1.1rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 16px 40px;
      border-radius: 4px;
      transition: background-color 0.2s ease;
    }

    .cta-button:hover {
      background-color: #1e3d2f;
    }
  </style>
</head>
<body>
  <img src="Website-placeholder.png" alt="Fairways and Fastballs - Coming Soon" />
  <div class="cta-wrapper">
    <a href="signup.html" class="cta-button">Keep Me In The Loop!</a>
  </div>
</body>
</html>
